version: "3.1"
nlu:
  - intent: saludo
    examples: |
      - hola
      - holi
      - buenas
      - buenos dias
      - buenas noches
      - buenos días
      - buenas tardes, VitaDent
      - buenas, una consulta
      - hola, me ayudan porfa
      - holaa
      - qué tal
  - intent: despedida
    examples: |
      - gracias, hasta luego
      - eso es todo
      - chao
  - intent: reservar_cita
    examples: |
      - quiero reservar una cita
      - quiero sacar un turno
      - ayudeme agendando una cita
      - quisiera agendar para mañana
      - ayúdame con un turno para [limpieza dental](tratamiento)
      - quiero sacar una cita para [diagnóstico general](tratamiento)
      - me puedes agendar con [Dra. Odalis Monar](especialista)
      - quisiera una cita el [27/11/2026 14:00](fecha_hora)
      - un turno para el [27/11/2026 14:00](fecha_hora), por favor
      - necesito una cita odontologica
      - deseo reservar una consulta dental
      - me da cita por favor
      - quiero turno para [limpieza](tratamiento)
      - necesito una cita para [calzas](tratamiento)
      - necesito agendar una consulta
      - quisiera sacar turno para odontología
      - me pueden ayudar con una cita dental
      - quiero una cita para [profilaxis](tratamiento)
      - agenda para [Ortodoncia](tratamiento)
      - necesito una cita de [endodoncia](tratamiento) con [Dra. Odalis Monar](especialista) el [25/12/2026 10:30](fecha_hora)
  - intent: consultar_disponibilidad
    examples: |
      - qué horarios tienen disponibles
      - hay un espacio libre esta semana
      - que hora tiene para mañana
      - tienen turno el viernes
      - hay disponibilidad con la doctora [Odalis Monar](especialista)
      - hay citas para esta semana
      - quiero saber si hay espacio mañana
      - ¿qué horas libres tienen el [27/11/2026 14:00](fecha_hora)?
      - revisa disponibilidad para [diagnóstico general](tratamiento)
      - hay un turno con [Dra. Odalis Monar](especialista) el [27/11/2026 14:00](fecha_hora)
  - intent: cancelar_cita
    examples: |
      - quiero cancelar mi cita
      - ya no voy a poder ir a la cita
      - por favor anule mi turno
      - anula mi turno
      - ya no puedo asistir a mi reserva
      - cancela el turno, ya no alcanzo a ir
      - anula la cita que tengo agendada
  - intent: reprogramar_cita
    examples: |
      - necesito cambiar la fecha de mi cita
      - puedo mover el turno para otro día
      - quiero reprogramar mi cita
      - cambie mi cita para el lunes
      - deseo mover el turno
      - cambiemos la hora de mi cita
      - quiero pasar mi turno para otro día
  - intent: consultar_tratamientos
    examples: |
      - qué tratamientos ofrecen
      - cuáles son los servicios de la clínica
      - quiero consultar el catálogo
  - intent: consultar_especialistas
    examples: |
      - qué especialistas trabajan ahí
      - quién atiende ortodoncia
      - quiero conocer a los odontólogos
  - intent: consultar_estado_cita
    examples: |
      - quiero saber el estado de mi cita
      - cómo va mi cita
      - necesito consultar si mi turno está confirmado
      - mi cita sigue pendiente
      - ¿me confirman para qué día quedó la cita?
      - quisiera revisar mi reserva
      - mi código de cita es [AB12CD34](codigo_cita)
      - tengo el código [ZX91YU42](codigo_cita), quiero consultar la cita
      - revisa el estado de la cita [AB12CD34](codigo_cita)
      - quiero saber cuándo me toca, mi código es [ZX91YU42](codigo_cita)
  - intent: solicitar_asesor_humano
    examples: |
      - quiero hablar con recepción
      - pasame con una persona porfa
      - quiero hablar con alguien de la clinica
      - necesito ayuda humana
      - necesito que me atienda una persona
      - pásame con un asesor
  - intent: mensaje_fuera_de_alcance
    examples: |
      - tengo dolor, dime qué medicamento tomar
      - diagnostica qué problema tengo
      - quiero saber qué enfermedad dental tengo
  - intent: afirmar
    examples: |
      - sí
      - correcto
      - confirmo
      - envíala
      - dale, si está bien
  - intent: negar
    examples: |
      - no
      - cancela
      - esos datos están mal
      - mejor no
      - no la envies
  - intent: corregir_datos
    examples: |
      - me equivoqué en los datos
      - quiero corregir la información
      - escribí mal mi nombre
      - puse mal la fecha
      - cambiar el tratamiento
      - corrige mi nombre a [Ana Ejemplo](nombre)
      - el tratamiento correcto es [Limpieza dental](tratamiento)
      - cambia la fecha a [27/11/2026 14:00](fecha_hora)
      - prefiero con [Dra. Odalis Monar](especialista)
  - intent: abandonar_flujo
    examples: |
      - salir de aquí
      - ya no quiero seguir
      - dejemos esto
      - cancelar este proceso
  - intent: nlu_fallback
    examples: |
      - asdf qwer
      - no sé cómo explicarlo
