version: "3.1"
rules:
  - rule: Saludar
    steps:
      - intent: saludo
      - action: utter_saludo

  - rule: Despedir
    steps:
      - intent: despedida
      - action: utter_despedida

  - rule: Iniciar reserva
    steps:
      - intent: reservar_cita
      - action: reserva_form
      - active_loop: reserva_form

  - rule: Revisar reserva completa
    condition:
      - active_loop: reserva_form
    steps:
      - action: reserva_form
      - active_loop: null
      - action: action_revisar_reserva

  - rule: Iniciar cancelación
    steps:
      - intent: cancelar_cita
      - action: cancelar_form
      - active_loop: cancelar_form

  - rule: Revisar cancelación completa
    condition:
      - active_loop: cancelar_form
    steps:
      - action: cancelar_form
      - active_loop: null
      - action: action_revisar_cancelacion

  - rule: Iniciar reprogramación
    steps:
      - intent: reprogramar_cita
      - action: reprogramar_form
      - active_loop: reprogramar_form

  - rule: Revisar reprogramación completa
    condition:
      - active_loop: reprogramar_form
    steps:
      - action: reprogramar_form
      - active_loop: null
      - action: action_revisar_reprogramacion

  - rule: Iniciar consulta de cita
    steps:
      - intent: confirmar_cita
      - action: consulta_cita_form
      - active_loop: consulta_cita_form

  - rule: Consultar cita completa
    condition:
      - active_loop: consulta_cita_form
    steps:
      - action: consulta_cita_form
      - active_loop: null
      - action: action_consultar_cita

  - rule: Iniciar consulta de disponibilidad
    steps:
      - intent: consultar_disponibilidad
      - action: disponibilidad_form
      - active_loop: disponibilidad_form

  - rule: Consultar disponibilidad completa
    condition:
      - active_loop: disponibilidad_form
    steps:
      - action: disponibilidad_form
      - active_loop: null
      - action: action_consultar_disponibilidad

  - rule: Confirmar operación pendiente
    steps:
      - intent: afirmar
      - action: action_confirmar_operacion

  - rule: Rechazar operación pendiente
    steps:
      - intent: negar
      - action: action_cancelar_solicitud

  - rule: Corregir datos durante reserva
    condition:
      - active_loop: reserva_form
    steps:
      - intent: corregir_datos
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_cancelar_solicitud

  - rule: Abandonar reserva
    condition:
      - active_loop: reserva_form
    steps:
      - intent: abandonar_flujo
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_cancelar_solicitud

  - rule: Consultar tratamientos
    steps:
      - intent: consultar_tratamientos
      - action: action_consultar_catalogo

  - rule: Consultar especialistas
    steps:
      - intent: consultar_especialistas
      - action: action_consultar_catalogo

  - rule: Derivar a recepción
    condition:
      - active_loop: null
    steps:
      - intent: solicitar_asesor_humano
      - action: utter_derivar

  - rule: Responder solicitud médica fuera de alcance
    steps:
      - intent: mensaje_fuera_de_alcance
      - action: utter_fuera_alcance

  - rule: Responder mensaje no entendido
    steps:
      - intent: nlu_fallback
      - action: utter_fallback

  - rule: Transferir reserva a recepción
    condition:
      - active_loop: reserva_form
    steps:
      - intent: solicitar_asesor_humano
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_derivar

  - rule: Abandonar cancelación
    condition:
      - active_loop: cancelar_form
    steps:
      - intent: abandonar_flujo
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_cancelar_solicitud

  - rule: Abandonar reprogramación
    condition:
      - active_loop: reprogramar_form
    steps:
      - intent: abandonar_flujo
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_cancelar_solicitud

  - rule: Abandonar disponibilidad
    condition:
      - active_loop: disponibilidad_form
    steps:
      - intent: abandonar_flujo
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_cancelar_solicitud

  - rule: Abandonar consulta de cita
    condition:
      - active_loop: consulta_cita_form
    steps:
      - intent: abandonar_flujo
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_cancelar_solicitud

  - rule: Transferir cancelación a recepción
    condition:
      - active_loop: cancelar_form
    steps:
      - intent: solicitar_asesor_humano
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_derivar

  - rule: Transferir reprogramación a recepción
    condition:
      - active_loop: reprogramar_form
    steps:
      - intent: solicitar_asesor_humano
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_derivar

  - rule: Transferir consulta de disponibilidad a recepción
    condition:
      - active_loop: disponibilidad_form
    steps:
      - intent: solicitar_asesor_humano
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_derivar

  - rule: Transferir consulta de cita a recepción
    condition:
      - active_loop: consulta_cita_form
    steps:
      - intent: solicitar_asesor_humano
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_derivar
